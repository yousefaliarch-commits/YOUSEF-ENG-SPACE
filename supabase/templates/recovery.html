<!-- EngSpace — reset password. The link works on any device and opens the «new password» screen there. -->
<div dir="rtl" style="font-family:system-ui,'IBM Plex Sans Arabic',sans-serif;max-width:480px;margin:auto;padding:24px;color:#18181b">
  <h2 style="margin:0 0 8px">إعادة تعيين كلمة المرور</h2>
  <p style="line-height:1.8">اضغط الزر لاختيار كلمة مرور جديدة. إن لم تطلب ذلك، تجاهل هذه الرسالة.</p>
  <p><a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=recovery&reset=1#app" style="display:inline-block;background:#6d5bd0;color:#fff;padding:12px 22px;border-radius:12px;text-decoration:none">كلمة مرور جديدة</a></p>
  <hr style="border:0;border-top:1px solid #e4e4e7;margin:20px 0">
  <div dir="ltr"><p style="margin:0"><b>Reset your EngSpace password</b> — open the button above on any device.</p></div>
</div>
