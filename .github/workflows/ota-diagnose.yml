# TEMPORARY (removed before merge): how the hosted app-updates bucket answers the way a phone asks.
name: OTA diagnose
on:
  push:
    branches: [fix/ota-hang]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe manifest and bundle
        run: |
          base="https://cyziykbqldtxyquqvvkr.supabase.co/storage/v1/object/public/app-updates/preview"
          for o in "capacitor://localhost" "https://localhost" "http://localhost"; do
            echo "=== manifest GET Origin: $o"; curl -sS -D - -o /tmp/m.json -H "Origin: $o" "$base/manifest.json?t=1" | grep -iE "^HTTP|access-control|content-type|cache-control|content-length|vary"; done
          echo "=== preflight"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: capacitor://localhost" -H "Access-Control-Request-Method: GET" "$base/manifest.json" | grep -iE "^HTTP|access-control"
          cat /tmp/m.json; url=$(node -p 'require("/tmp/m.json").url')
          echo "=== bundle HEAD"; curl -sS -I "$url" | grep -iE "^HTTP|content-|accept-ranges|cache|etag|cf-"
          echo "=== bundle GET (okhttp-like)"; curl -sS -D - -o /tmp/b.zip -H "Accept-Encoding: gzip" -A "okhttp/4.12.0" "$url" | grep -iE "^HTTP|content-|transfer-encoding|accept-ranges"
          ls -l /tmp/b.zip; sha256sum /tmp/b.zip
          echo "=== bundle GET range"; curl -sS -D - -o /dev/null -H "Range: bytes=0-" "$url" | grep -iE "^HTTP|content-range|content-length"
          echo "=== iOS UA"; curl -sS -D - -o /dev/null -A "EngSpace/1 CFNetwork/1568 Darwin/24.0.0" "$url" | grep -iE "^HTTP|content-length|content-encoding"
