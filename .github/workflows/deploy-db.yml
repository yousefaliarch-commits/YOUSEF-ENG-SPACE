# Applies supabase/migrations to the hosted Frankfurt project and deploys the purge-verification, send-push and upload-media functions.
# Runs when migrations change on main, or by hand (Actions → Deploy database → Run workflow).
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) and
# SUPABASE_DB_PASSWORD (the database password chosen when the project was created).
name: Deploy database
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Make this account the first administrator (it must have signed up in the app; only works while no administrator exists)"
        required: false
        default: "yousefaliarch@gmail.com"
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
concurrency: deploy-db
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cyziykbqldtxyquqvvkr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Add the repository secret SUPABASE_DB_PASSWORD"; exit 1; }
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - name: Migrations waiting to be applied
        run: npx supabase migration list
      - run: npx supabase db push
      - run: npx supabase functions deploy purge-verification --project-ref "$PROJECT_REF" --use-api
      - run: npx supabase functions deploy send-push --project-ref "$PROJECT_REF" --use-api
      - run: npx supabase functions deploy upload-media --project-ref "$PROJECT_REF" --use-api
      # the media janitor (pg_cron → upload-media every 10 minutes): a fresh MEDIA_SECRET for the function and the database's
      # Vault on every deploy, so nobody has to know it; the database reaches the function at push_url (written below / earlier)
      - name: Media janitor secret
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          secret=$(openssl rand -hex 24); echo "::add-mask::$secret"
          npx supabase secrets set --project-ref "$PROJECT_REF" MEDIA_SECRET="$secret" >/dev/null
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$(cat supabase/.temp/pooler-url)" -XAt -v ON_ERROR_STOP=1 -v url="https://$PROJECT_REF.supabase.co" -v secret="$secret" >/dev/null <<'SQL'
          select set_config('engspace.tmp_url', :'url', false), set_config('engspace.tmp_secret', :'secret', false);
          do $$
          declare u text := current_setting('engspace.tmp_url'); s text := current_setting('engspace.tmp_secret'); sid uuid;
          begin
            select v.id into sid from vault.secrets v where v.name = 'push_url';
            if sid is null then perform vault.create_secret(u, 'push_url'); end if;
            select v.id into sid from vault.secrets v where v.name = 'media_secret';
            if sid is null then perform vault.create_secret(s, 'media_secret'); else perform vault.update_secret(sid, s, 'media_secret'); end if;
          end $$;
          select set_config('engspace.tmp_secret', '', false);
          SQL
          # the proof: one janitor pass (moves pre-1.3 files to random names, deletes orphans)
          sleep 5
          answer=$(curl -sS -X POST -H "x-media-secret: $secret" "https://$PROJECT_REF.supabase.co/functions/v1/upload-media" || true)
          echo "::notice title=Media janitor answered::$answer"
          echo "$answer" | jq -e 'has("moved") and has("removed")' >/dev/null || { echo "::error::upload-media did not answer the janitor"; exit 1; }
      # Push delivery. The Firebase service account is the repository secret FCM_SERVICE_ACCOUNT (the whole JSON file) — it is never
      # in the repo. PUSH_SECRET is generated here on every deploy and handed to both sides (the function's secrets and the database's
      # Vault), so nobody has to know it. Without the FCM secret this step only warns and Android push stays off.
      - name: Push notification credentials
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::warning title=Push credentials::Add the repository secret FCM_SERVICE_ACCOUNT (the Firebase service-account JSON file, pasted whole) and run Deploy database again — Android push stays off until then"; exit 0
          fi
          sa=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -c .) || { echo "::error::FCM_SERVICE_ACCOUNT is not valid JSON"; exit 1; }
          secret=$(openssl rand -hex 24); echo "::add-mask::$secret"
          args=(PUSH_SECRET="$secret" FCM_SERVICE_ACCOUNT="$sa")
          [ -n "$APNS_KEY_P8" ] && [ -n "$APNS_KEY_ID" ] && [ -n "$APNS_TEAM_ID" ] && args+=(APNS_KEY_P8="$APNS_KEY_P8" APNS_KEY_ID="$APNS_KEY_ID" APNS_TEAM_ID="$APNS_TEAM_ID")
          npx supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" >/dev/null
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$(cat supabase/.temp/pooler-url)" -XAt -v ON_ERROR_STOP=1 -v url="https://$PROJECT_REF.supabase.co" -v secret="$secret" >/dev/null <<'SQL'
          select set_config('engspace.tmp_url', :'url', false), set_config('engspace.tmp_secret', :'secret', false);
          do $$
          declare u text := current_setting('engspace.tmp_url'); s text := current_setting('engspace.tmp_secret'); sid uuid;
          begin
            select v.id into sid from vault.secrets v where v.name = 'push_url';
            if sid is null then perform vault.create_secret(u, 'push_url'); else perform vault.update_secret(sid, u, 'push_url'); end if;
            select v.id into sid from vault.secrets v where v.name = 'push_secret';
            if sid is null then perform vault.create_secret(s, 'push_secret'); else perform vault.update_secret(sid, s, 'push_secret'); end if;
          end $$;
          select set_config('engspace.tmp_secret', '', false);
          SQL
          # the proof: ask the function itself which platforms it can deliver to
          sleep 5
          answer=$(curl -sS -X POST -H "x-push-secret: $secret" "https://$PROJECT_REF.supabase.co/functions/v1/send-push" || true)
          echo "::notice title=send-push answered::$answer"
          echo "$answer" | jq -e '.platforms | index("android")' >/dev/null || { echo "::error::send-push does not see the Firebase credentials"; exit 1; }
      # `supabase link` stores the pooler address (without the password) in supabase/.temp/pooler-url
      - name: First administrator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_email != '' }}
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          out=$(echo "select public.bootstrap_admin(:'email');" | psql "$(cat supabase/.temp/pooler-url)" -XAt -v ON_ERROR_STOP=1 -v email="$ADMIN_EMAIL" 2>&1) && echo "::notice::$ADMIN_EMAIL is now an administrator ($out)" \
            || { err=$(echo "$out" | grep -o 'ERROR:.*' | head -1); case "$err" in *"already exists"*) echo "::notice::An administrator already exists — staff roles are managed in the admin console (Members → staff role)";; *) echo "::warning::Administrator not set: $err — sign up in the app with $ADMIN_EMAIL, then run this workflow again";; esac; }
      # read-only: who holds a staff role, and how each of those accounts signs in (e-mail, Google, phone…)
      - name: Staff accounts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          echo "select u.email, p.staff, p.role, p.onboarded, coalesce((select string_agg(i.provider, '+' order by i.provider) from auth.identities i where i.user_id = u.id), '-') as sign_in, (select count(*) from auth.users u2 where lower(u2.email) = lower(u.email)) as accounts_with_this_email from public.profiles p join auth.users u on u.id = p.id where p.staff <> 'member' or lower(u.email) = lower(:'email');" \
            | psql "$(cat supabase/.temp/pooler-url)" -XAt -F ' | ' -v ON_ERROR_STOP=1 -v email="${{ inputs.admin_email }}" \
            | while read -r row; do echo "::notice title=Staff account (email | staff | role | onboarded | sign-in | accounts with this email)::$row"; done
      # read-only: the sign-in redirect settings (Authentication → URL Configuration) and which providers are on
      - name: Auth URL settings
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq -r '"site_url=\(.site_url) | redirect_urls=\(.uri_allow_list // "") | google=\(.external_google_enabled) | apple=\(.external_apple_enabled) | phone=\(.external_phone_enabled) | email_confirm=\(.mailer_autoconfirm|not)"' \
            | while read -r row; do echo "::notice title=Auth URL settings::$row"; done

