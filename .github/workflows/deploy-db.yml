# Applies supabase/migrations to the hosted Frankfurt project and deploys the purge-verification function.
# Runs when migrations change on main, or by hand (Actions → Deploy database → Run workflow).
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) and
# SUPABASE_DB_PASSWORD (the database password chosen when the project was created).
name: Deploy database
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Make this account the first administrator (it must have signed up in the app; only works while no administrator exists)"
        required: false
        default: "yousefaliarch@gmail.com"
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
concurrency: deploy-db
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cyziykbqldtxyquqvvkr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Add the repository secret SUPABASE_DB_PASSWORD"; exit 1; }
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - name: Migrations waiting to be applied
        run: npx supabase migration list
      - run: npx supabase db push
      - run: npx supabase functions deploy purge-verification --project-ref "$PROJECT_REF" --use-api
      # `supabase link` stores the pooler address (without the password) in supabase/.temp/pooler-url
      - name: First administrator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_email != '' }}
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          out=$(echo "select public.bootstrap_admin(:'email');" | psql "$(cat supabase/.temp/pooler-url)" -XAt -v ON_ERROR_STOP=1 -v email="$ADMIN_EMAIL" 2>&1) && echo "::notice::$ADMIN_EMAIL is now an administrator ($out)" \
            || echo "::warning::Administrator not set: $(echo "$out" | grep -o 'ERROR:.*' | head -1) — sign up in the app with $ADMIN_EMAIL, then run this workflow again"
