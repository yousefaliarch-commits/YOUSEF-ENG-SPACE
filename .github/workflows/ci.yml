name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated dictionary is committed and current
        run: git diff --exit-code -- src/i18n/en.generated.json i18n/keys.json

  # The database: every migration from scratch, the RLS / privacy suites (pgTAP), then the app's cloud layer end to end
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth, storage, API)
        run: npx supabase start -x studio,logflare,vector,imgproxy,supavisor,postgres-meta
      - name: RLS and privacy tests (pgTAP)
        run: npx supabase test db
      # upload-media (every image goes through it since Phase 1.3) runs in the local edge runtime
      - name: Serve the Edge Functions
        run: |
          nohup npm run db:functions > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/upload-media)" = "200" ] && exit 0; sleep 3; done
          cat /tmp/functions.log; exit 1
      - name: Cloud layer end to end (src/backend/cloud.ts as real members)
        run: npm run test:cloud

  # The whole app in a browser on two phone profiles (iPhone 15, Pixel 7): demo members of every role, then the seeded test
  # accounts against a local Supabase (sign-in, every tab, every tool, the admin console, publishing a post).
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase and seed the test accounts
        run: |
          npx supabase start -x studio,logflare,vector,imgproxy,supavisor,postgres-meta
          npm run db:env
          npm run db:seed
          nohup npm run db:functions > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/upload-media)" = "200" ] && exit 0; sleep 3; done
          cat /tmp/functions.log; exit 1
      - name: End-to-end (demo + live, both phone profiles)
        run: E2E_LIVE=1 npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # An installable Android build of every push (Actions → this run → Artifacts → engspace-debug-apk).
  # With the repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY) it talks to the hosted project;
  # without them it is the demo.
  android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: engspace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
