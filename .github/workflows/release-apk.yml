# Builds the Android app (connected to the live Frankfurt project) and publishes it as a GitHub Release asset, so the
# APK can be downloaded straight to a phone from the release page instead of digging through Actions artifacts.
# Run from Actions → "Release preview APK" → Run workflow (or `gh workflow run release-apk.yml -f tag=v0.1.1-preview`).
name: Release preview APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0-preview)
        required: true
        default: v0.1.0-preview
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "engspace-${TAG}.apk"
          NOTES="Preview build of EngSpace for Android, connected to the live platform (Frankfurt). Debug-signed: on the phone, allow installing from this source when asked. Built from ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "engspace-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "engspace-${TAG}.apk" --prerelease --target "$GITHUB_SHA" --title "EngSpace ${TAG}" --notes "$NOTES"
          fi
